<nav class="navbar navbar-expand-lg fixed-top bg-body-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">
      <img src="assets/brand.svg" alt="Carcará" height="32px">
    </a>
    <button class="navbar-toggler" type="button" (click)="toggleNavbarCollapse()" title="Navegación">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse" [ngbCollapse]="isNavbarCollapsed()">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (link of links(); track link.route) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="link.route" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="isNavbarCollapsed.set(true)" ariaCurrentWhenActive="page">
              {{ link.title }}
            </a>
          </li>
        }
      </ul>

      <app-user-menu />
      <span class="d-none d-sm-inline vr mx-2"></span>
      <app-settings-menu />
    </div>
  </div>
</nav>
<app-toast-container></app-toast-container>
<router-outlet></router-outlet>
