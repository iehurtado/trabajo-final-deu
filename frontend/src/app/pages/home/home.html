<main class="container-fluid">
  <h1 class="visually-hidden">Home</h1>
  <div class="my-3">
    <label for="buscar" class="form-label">Buscar</label>
    <ng-select labelForId="buscar" [compareWith]="compareWith" groupBy="tipo" (change)="selectMarker($event)">
      @for (element of searchableElems; track element.marker) {
        <ng-option [value]="element">{{ element.label }}</ng-option>
      }
    </ng-select>
  </div>
  <div>
    <div class="card">
      <div class="card-body p-0">
        <app-map id="map" [loading]="loading()">
          <ng-template appMapPanel>
            @if (panel(); as panel) {
              <div class="d-flex justify-content-end">
                <button class="btn btn-close btn-sm" aria-label="Cerrar" (click)="closePanel()"></button>
              </div>
              <ng-container *ngComponentOutlet="panel.component; inputs: panel.inputs"></ng-container>
            } @else {
              <fa-icon [icon]="faInfoCircle" alt=""/>
              Seleccione un marcador en el mapa para ver la información disponible
            }
          </ng-template>
        </app-map>
      </div>
    </div>
  </div>
</main>
@if (canAddPuntos()) {
  <app-fixed-footer>
    <div class="w-100 text-end">
      <a role="button" class="btn btn-primary d-block d-sm-inline" routerLink="/puntos/create" [state]="{ backlink: ['/'] }">
        Agregar Punto de Interés...
      </a>
    </div>
  </app-fixed-footer>
}
